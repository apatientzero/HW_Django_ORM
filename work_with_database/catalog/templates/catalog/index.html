<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог телефонов</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        img { max-width: 100px; height: auto; }
    </style>
</head>
<body>
    <h1>Каталог телефонов</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Изображение</th>
                <th>Цена</th>
                <th>Дата выпуска</th>
            </tr>
        </thead>
        <tbody>
            {% for phone in phones %}
            <tr>
                <td>{{ phone.id }}</td>
                <td>{{ phone.name }}</td>
                <td>
                    {% if phone.image %}
                        <img src="{{ phone.image }}" alt="{{ phone.name }}">
                    {% else %}
                        Нет изображения
                    {% endif %}
                </td>
                <td>{{ phone.price }} руб.</td>
                <td>{{ phone.release_date }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">Телефоны не найдены</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

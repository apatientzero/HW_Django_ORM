<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <style>
        .phone-item { border: 1px solid #ccc; padding: 10px; margin: 10px 0; display: flex; align-items: center; }
        .phone-item img { max-width: 100px; margin-right: 20px; }
        .phone-info h3 { margin: 0 0 10px 0; }
        .phone-info a { text-decoration: none; color: blue; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Каталог телефонов</h1>
    
    <!-- Здесь можно добавить форму сортировки, если требуется -->
    
    {% for phone in phones %}
    <div class="phone-item">
        {% if phone.image %}
            <img src="{{ phone.image }}" alt="{{ phone.name }}">
        {% endif %}
        <div class="phone-info">
            <h3>{{ phone.name }}</h3>
            <p>Цена: {{ phone.price }} руб.</p>
            <p>Дата выпуска: {{ phone.release_date }}</p>
            <!-- Ссылка на детальную страницу -->
            <a href="{% url 'product' phone.slug %}">Подробнее</a>
        </div>
    </div>
    {% empty %}
    <p>Телефоны не найдены</p>
    {% endfor %}
</body>
</html>
